# Public mode: nobody is trusted by address; members come in with their token. Use on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.public.yaml up -d
#
# Ports stay on this machine's loopback; put a TLS proxy or tunnel with a fixed domain in front
# (CHARET_PUBLIC_URL; CHARET_PUBLIC_PREVIEW_URL only when previews get their own address, otherwise
# the tool's address serves them sandboxed). See docs/public.md.

services:
  server:
    command: ["charet-server", "--public"]
    environment:
      CHARET_PUBLIC_URL: ${CHARET_PUBLIC_URL:?set CHARET_PUBLIC_URL to the address people open}
      CHARET_PREVIEW_URL: ${CHARET_PUBLIC_PREVIEW_URL:-}
