# Public mode: everyone signs in (invite links; Google or another provider optional). Use on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.public.yaml up -d
#
# Ports stay on this machine's loopback; put a TLS proxy or tunnel with a fixed domain in front
# (BOARD_PUBLIC_URL; BOARD_PUBLIC_PREVIEW_URL only when previews get their own address, otherwise
# the tool's address serves them sandboxed). See docs/public.md.

services:
  server:
    command: ["board-server", "--public"]
    environment:
      BOARD_PUBLIC_URL: ${BOARD_PUBLIC_URL:?set BOARD_PUBLIC_URL to the address people open}
      BOARD_PREVIEW_URL: ${BOARD_PUBLIC_PREVIEW_URL:-}
      BOARD_OIDC_ISSUER: ${BOARD_OIDC_ISSUER:-https://accounts.google.com}
      BOARD_OIDC_CLIENT_ID: ${BOARD_OIDC_CLIENT_ID:-}
      BOARD_OIDC_CLIENT_SECRET: ${BOARD_OIDC_CLIENT_SECRET:-}
      BOARD_ADMIN_EMAILS: ${BOARD_ADMIN_EMAILS:-}
