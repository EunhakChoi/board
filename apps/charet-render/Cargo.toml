[package]
name = "charet-render"
description = "Renders preview pages in Chromium: screenshots, element maps and problems. Called by charet-server only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chromiumoxide = { version = "0.9.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
