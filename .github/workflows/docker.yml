name: docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - compose.yaml
      - compose.agent.yaml
      - apps/charet-agent/**
      - .dockerignore
      - docker/**
      - scripts/docker-smoke.sh
      - Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make docker-smoke
