openapi: 3.1.0
info:
  title: charet API
  version: 0.0.0
  description: >
    HTTP contract between charet-server and its clients (charet-web, charet-cli).
    Every route lives under /api. Errors share one shape (Error).
    Change this file first, then run `make gen-api`.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: http://127.0.0.1:5280
tags:
  - name: system
  - name: auth
  - name: projects
  - name: branches
  - name: captures
  - name: comments
  - name: handoff
  - name: inbox
  - name: settings
  - name: agent
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Running version and the latest release, when update checks are on
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Versions, links and whether the internal services answer (for `charet doctor`)
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/ws:
    get:
      tags: [realtime]
      operationId: realtime
      summary: The realtime channel of a project room (WebSocket)
      description: >-
        Upgrade to a WebSocket. The server sends `hello` (you, peers with their latest presence,
        `seq`, `missed` events since `since`, `reload` when they no longer reach back, `working`),
        then `join`, `leave`, `presence` (`from`, `data`), `event` (`seq`, `kind`, `data`),
        `admin` (admins only) and `working`. Clients send `{"type":"presence","data":{…}}`
        (at most 4 KiB). Only the tool's own pages may connect (`Origin` must match).
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          description: The last event `seq` this client saw
          schema:
            type: integer
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who is calling
      description: >-
        A member by token or session. A browser without a session becomes a visitor here (a cookie is set) while visitors are allowed; otherwise 401
        `token_required`. 401 `replaced`: the token signed in on another browser since.
      responses:
        "200":
          description: The calling actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/token:
    post:
      tags: [auth]
      operationId: signInWithToken
      summary: Signs the browser in with a member's token (sets the session cookie)
      description: Another browser signed in with the same token is signed out; the CLI is not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Ends the browser's session (it is a visitor again)
      responses:
        "204":
          description: Signed out
  /api/admin/users:
    get:
      tags: [access]
      operationId: listUsers
      summary: Every member with their token (admins)
      responses:
        "200":
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: addUser
      summary: Adds a member and makes their token (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, role]
              properties:
                name:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: The new member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [access]
      operationId: changeUser
      summary: Renames a member or changes their role (admins)
      description: The owner (this machine's admin) and the last admin stay admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: The member now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [access]
      operationId: removeUser
      summary: Removes a member; their token stops and their browsers are signed out (admins)
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/users/{id}/token:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [access]
      operationId: reissueUserToken
      summary: Gives a member a new token; the old one stops and their browsers are signed out (admins)
      responses:
        "200":
          description: The member with the new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/access:
    get:
      tags: [access]
      operationId: getAccess
      summary: What people without a token may do server-wide (admins)
      responses:
        "200":
          description: Access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [access]
      operationId: setAccess
      summary: What visitors may do server-wide, unless a project says otherwise (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Access"
      responses:
        "200":
          description: Access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/sharing:
    get:
      tags: [admin]
      operationId: getSharing
      summary: Whether and where this local charet is shared (admins)
      responses:
        "200":
          description: Sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sharing"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: startSharing
      summary: Turns sharing on or changes its address (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  $ref: "#/components/schemas/ShareMode"
                url:
                  type: string
                  description: "For `address`: the address other machines open (it must reach the remote door)"
                authtoken:
                  type: string
                  description: "For `ngrok`: a new authtoken (kept, never returned); else the saved one"
                domain:
                  type: string
                  description: "For `ngrok`: a domain of the account (else ngrok picks one)"
      responses:
        "200":
          description: Sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sharing"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [admin]
      operationId: stopSharing
      summary: Turns sharing off (admins)
      responses:
        "200":
          description: Sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sharing"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/me/notifications:
    get:
      tags: [inbox]
      operationId: listNotifications
      summary: The caller's notifications, newest first (empty in local mode and for visitors)
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Notifications and how many are unread
          content:
            application/json:
              schema:
                type: object
                required: [notifications, unread]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  unread:
                    type: integer
  /api/me/notifications/read:
    post:
      tags: [inbox]
      operationId: markNotificationsRead
      summary: Marks these notifications read, or all of them when `ids` is left out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: How many stay unread
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread:
                    type: integer
  /api/admin/webhooks:
    get:
      tags: [settings]
      operationId: listWebhooks
      summary: Webhooks and the events they can choose (admin)
      responses:
        "200":
          description: Webhooks (without secrets)
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, events]
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
                  events:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [settings]
      operationId: createWebhook
      summary: Adds a webhook; its signing secret is shown only now (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                events:
                  type: array
                  description: Empty or left out means every event
                  items:
                    type: string
                project:
                  type: [string, "null"]
                  description: Only this project's events (needed for a private project)
      responses:
        "201":
          $ref: "#/components/responses/WebhookSecret"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [settings]
      operationId: deleteWebhook
      summary: Removes a webhook (admin)
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/webhooks/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [settings]
      operationId: rotateWebhookSecret
      summary: Gives the webhook a new signing secret, shown only now; the old one stops working
      responses:
        "200":
          $ref: "#/components/responses/WebhookSecret"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [settings]
      operationId: testWebhook
      summary: Sends a `ping` delivery now and records the outcome
      responses:
        "200":
          description: The webhook with `lastStatus` / `lastError` of this delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the caller can see
      responses:
        "200":
          description: Projects, by key
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project, empty or from imported files (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: The project and its first version
          content:
            application/json:
              schema:
                type: object
                required: [project, version]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  version:
                    $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A project with that key exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete the project with its versions, captures and comments (admin; no undo)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Renames a project or sets who can see it (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                visibility:
                  type: string
                  enum: [team, private]
                  description: "`private`: only members and admins see it"
      responses:
        "200":
          description: The project now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/members:
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: Who may see the project while it is private, besides admins (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      responses:
        "200":
          description: User ids
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/members/{user}:
    put:
      tags: [projects]
      operationId: addProjectMember
      summary: Adds a member (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Added
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Removes a member (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/checkout:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: checkoutProject
      summary: The project files at a revision, as a gzipped tar (members; never visitors)
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
      responses:
        "200":
          description: Gzipped tar of the files
          headers:
            X-Charet-Commit:
              description: Commit id of the archive
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/visitors:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    put:
      tags: [access]
      operationId: setProjectVisitors
      summary: What visitors (no token) may do on this project (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visitors]
              properties:
                visitors:
                  oneOf:
                    - $ref: "#/components/schemas/VisitorAccess"
                    - type: "null"
                  description: "`null`: follow the server's setting"
      responses:
        "200":
          description: The project now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listVersions
      responses:
        "200":
          description: Versions of main, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/handoff:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [handoff]
      operationId: handoffStatus
      summary: Where the project stands against the product repo
      responses:
        "200":
          description: Baseline and what a handoff would carry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/handoff/export:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [handoff]
      operationId: exportHandoff
      summary: The patch from a version (default the baseline) to the newest, for the product repo (admins)
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 1
        - name: withMocks
          in: query
          description: Include charet's own files (`.charet/`, `charet.json`)
          schema:
            type: boolean
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/versions/{number}/handoff:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [handoff]
      operationId: markHandoff
      summary: Mark this version (and every one before it) as in the product repo (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commit]
              additionalProperties: false
              properties:
                commit:
                  type: string
                  description: The product repo commit that has it
      responses:
        "200":
          description: The marked version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/import:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [handoff]
      operationId: updateImport
      summary: Bring the product repo's files in again as an import version (admins)
      description: >-
        The files (the whole imported scope) are laid on the baseline and joined into main, so
        merged work not handed off stays. charet's own `.charet/` files are kept. Files changed on
        both sides answer `clash`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: The new (import) version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Clash"
  /api/projects/{key}/versions/{number}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [projects]
      operationId: restoreVersion
      summary: Record a new version that undoes what this version changed
      responses:
        "201":
          description: The new (restore) version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Clash"
  /api/projects/{key}/branches:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [branches]
      operationId: listBranches
      responses:
        "200":
          description: Branches, newest first
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [branches]
      operationId: createBranch
      summary: Start a draft, empty or with changes made on a checkout of `from`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                from:
                  type: string
                  description: "`main`, `v<n>` or a commit (default `main`)"
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileInput"
      responses:
        "201":
          description: The new branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    get:
      tags: [branches]
      operationId: getBranch
      responses:
        "200":
          description: The branch, its changes against main and what happened to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/push:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: pushBranch
      summary: Commit changed files on top of `base` (the branch head)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, files]
              additionalProperties: false
              properties:
                base:
                  type: string
                message:
                  type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileInput"
      responses:
        "200":
          description: The branch after the push
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The branch moved since `base`; `detail.head` is its head"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/branches/{number}/request-review:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: requestBranchReview
      summary: Ask the team to review a draft
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: mergeBranch
      summary: Join the branch into main as a new version
      description: >-
        First the merged result is built and the screens the change can reach are opened (the
        merge check). While it builds the answer is `pending` (try again); new problems answer
        `check_failed` with `detail.issues`. Protected files changed without an admin's approval
        answer `approval_required` with `detail.files` (an admin merging approves as they go).
      responses:
        "201":
          description: The new (merge) version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Clash"
  /api/projects/{key}/branches/{number}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: approveBranch
      summary: Approve the branch's protected-file changes as they are now (admins)
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: archiveBranch
      summary: Close the branch without merging
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: reopenBranch
      summary: Bring an archived branch back as a draft
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: duplicateBranch
      summary: A new draft of your own from where this branch is
      responses:
        "201":
          description: The new branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/branches/{number}/catch-up:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/BranchNumber"
    post:
      tags: [branches]
      operationId: catchUpBranch
      summary: Join the newest main into the branch (clashes are marked)
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: diffProject
      summary: Paths changed between two revisions
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          description: Defaults to `main`
          schema:
            type: string
      responses:
        "200":
          description: Changed paths
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [path, kind]
                      properties:
                        path:
                          type: string
                        kind:
                          type: string
                          enum: [added, modified, deleted]
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: previewProject
      summary: Static build of a revision, started on first call; poll until ready or failed
      description: >
        Once ready, pages are at `baseUrl` on the preview origin, e.g.
        `{baseUrl}.charet/frame.html?screen=<id>&t=<token>`. The token is short-lived and bound to
        this project and commit.
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
        - name: retry
          in: query
          description: Build again when the last build of this commit failed
          schema:
            type: boolean
      responses:
        "200":
          description: The build and, once ready, where to open it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: charet-workspace is not running, or previews are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [captures]
      operationId: checkProject
      summary: Open screens and stories of a revision and report problems (nothing is stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [captures]
      operationId: listCaptures
      summary: Stored captures, each marked stale when main moved in a way that can change it
      responses:
        "200":
          description: Captures
          content:
            application/json:
              schema:
                type: object
                required: [captures]
                properties:
                  captures:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capture"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [captures]
      operationId: captureProject
      summary: Capture screens and stories of a revision; already captured at that commit = skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/image:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureImage
      summary: The capture's picture
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/sheet:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [captures]
      operationId: captureSheet
      summary: Stored captures side by side in one picture (planned steps and missing captures are grey)
      parameters:
        - name: items
          in: query
          required: true
          description: "Comma separated `screen:<id>`, `story:<id>` or `planned`, at most 24"
          schema:
            type: string
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/elements:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureElements
      summary: The capture's element map
      responses:
        "200":
          description: Elements worth pointing at, in document order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Element"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [comments]
      operationId: listComments
      summary: Comments with their threads, oldest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
        - name: kind
          in: query
          schema:
            type: string
            enum: [screen, story]
        - name: target
          in: query
          schema:
            type: string
        - name: branch
          in: query
          description: Comments on this branch's screens instead of main's
          schema:
            type: integer
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [comments]
      operationId: addComment
      summary: Comment on an element of the latest capture (by point or selector)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, target, at, body]
              properties:
                kind:
                  type: string
                  enum: [screen, story]
                target:
                  type: string
                theme:
                  type: string
                  enum: [light, dark]
                at:
                  oneOf:
                    - type: object
                      required: [x, y]
                      properties:
                        x:
                          type: integer
                        y:
                          type: integer
                    - type: object
                      required: [selector]
                      properties:
                        selector:
                          type: string
                body:
                  type: string
                branch:
                  type: integer
                  description: Comment on this branch's screen (a spot of its live preview)
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: getComment
      summary: One comment with its thread
      responses:
        "200":
          description: The comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: replyComment
      summary: Reply in the thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: resolveComment
      summary: Resolve, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: reopenComment
      summary: Reopen, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: commentSnapshot
      summary: The capture the comment was made on (JPEG); the anchor box marks the element
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getManifest
      summary: Pages, screens, connections, flows and stories of a revision (from its build)
      parameters:
        - $ref: "#/components/parameters/Rev"
      responses:
        "200":
          description: The manifest (`.charet/manifest.json`, see @charet/sdk `Manifest`)
          content:
            application/json:
              schema:
                type: object
                required: [commit, manifest]
                properties:
                  commit:
                    type: string
                  manifest:
                    $ref: "#/components/schemas/Manifest"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listFiles
      summary: Every file path of a revision
      parameters:
        - $ref: "#/components/parameters/Rev"
      responses:
        "200":
          description: Sorted paths
          content:
            application/json:
              schema:
                type: object
                required: [commit, paths]
                properties:
                  commit:
                    type: string
                  paths:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/file:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: readFile
      summary: One file of a revision (up to 2 MB)
      parameters:
        - $ref: "#/components/parameters/Rev"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The bytes; `text/plain` when UTF-8. `X-Charet-Commit` is the commit read.
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/agent:
    get:
      tags: [agent]
      operationId: getAgent
      summary: Whether the web agent is on and which agents it offers (members)
      responses:
        "200":
          description: The web agent as the server offers it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/agent:
    get:
      tags: [agent]
      operationId: getAgentSettings
      summary: The web agent's settings (same as `/api/agent`, for the admins' page)
      responses:
        "200":
          description: The web agent as the server offers it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [agent]
      operationId: setAgentSettings
      summary: Default agent, models and API keys (admins). Keys are stored encrypted and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSettingsChange"
      responses:
        "200":
          description: The web agent now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStatus"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/costs:
    get:
      tags: [agent]
      operationId: getAgentCosts
      summary: Every web agent run and what each person spent (admins)
      responses:
        "200":
          description: Costs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCosts"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/projects/{key}/agent-runs:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [agent]
      operationId: listAgentRuns
      summary: The project's web agent runs, oldest first
      parameters:
        - name: branch
          in: query
          description: Only this branch's runs
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [agent]
      operationId: startAgentRun
      summary: Ask the web agent (editors). Without `branch` it starts a new draft; it waits while another run works on the same branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRun"
      responses:
        "201":
          description: The run (queued or running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/agent-runs/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [agent]
      operationId: listAgentMessages
      summary: A run's conversation
      parameters:
        - name: after
          in: query
          description: Only messages after this `seq`
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Messages, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/agent-runs/{id}/attachments/{seq}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/RunId"
      - name: seq
        in: path
        required: true
        description: 0-based, in the order attached
        schema:
          type: integer
          minimum: 0
    get:
      tags: [agent]
      operationId: getAgentAttachment
      summary: An image attached to a run's prompt
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/agent-runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [agent]
      operationId: cancelAgentRun
      summary: Stop a run (its asker or an admin). What it already saved stays on the branch.
      responses:
        "200":
          description: The run now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MemberId:
      name: user
      in: path
      required: true
      description: A user id
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Rev:
      name: rev
      in: query
      description: "`main` (default), `v<number>` or a commit id"
      schema:
        type: string
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CaptureKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [screen, story]
    CaptureTarget:
      name: target
      in: path
      required: true
      description: Screen or story id
      schema:
        type: string
    Theme:
      name: theme
      in: path
      required: true
      schema:
        type: string
        enum: [light, dark]
    BranchNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  responses:
    Clash:
      description: "Files changed on both sides; `detail.files` lists them"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    WebhookSecret:
      description: The webhook and its signing secret (shown once)
      content:
        application/json:
          schema:
            type: object
            required: [webhook, secret]
            properties:
              webhook:
                $ref: "#/components/schemas/Webhook"
              secret:
                type: string
    Changed:
      description: Someone wrote to it since you read it; `detail.rev` is its revision now
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Pending:
      description: Not possible yet (the preview is still building); try again shortly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A service charet needs (charet-workspace, charet-render) is not running
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RenderResults:
      description: One result per target and theme, in request order
      content:
        application/json:
          schema:
            type: object
            required: [commit, results]
            properties:
              commit:
                type: string
                description: The commit rendered; pass it as `rev` to render more of the same version
              results:
                type: array
                items:
                  $ref: "#/components/schemas/RenderResult"
    Invalid:
      description: Bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (or hidden from the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Size:
      type: object
      required: [w, h]
      properties:
        w:
          type: integer
        h:
          type: integer
    Manifest:
      type: object
      required: [manifestVersion, title, pages, screens, connections, flows, stories]
      properties:
        manifestVersion:
          type: integer
          enum: [1]
        title:
          type: string
        pages:
          type: array
          items:
            type: object
            required: [id, route, title]
            properties:
              id:
                type: string
              route:
                type: string
              title:
                type: string
              note:
                type: string
                description: What the page is for (absent in older builds)
        screens:
          type: array
          items:
            type: object
            required: [id, page, title, note, route, size, hasSetup]
            properties:
              id:
                type: string
              page:
                type: string
              title:
                type: string
              note:
                type: string
              route:
                type: string
              size:
                $ref: "#/components/schemas/Size"
              hasSetup:
                type: boolean
        connections:
          type: array
          items:
            type: object
            required: [from, to, label, kind]
            properties:
              from:
                type: string
              to:
                type: string
              label:
                type: string
              kind:
                type: string
                enum: [click, auto, error]
        flows:
          type: array
          items:
            type: object
            required: [id, title, steps]
            properties:
              id:
                type: string
              title:
                type: string
              note:
                type: string
                description: What the user is trying to do (absent in older builds)
              steps:
                type: array
                items:
                  type: object
                  required: [id, title, note, planned]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    note:
                      type: string
                    planned:
                      type: boolean
                      description: Not a screen yet
        stories:
          type: array
          items:
            type: object
            required: [id, component, title, size]
            properties:
              id:
                type: string
              component:
                type: string
              title:
                type: string
              size:
                $ref: "#/components/schemas/Size"
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Anchor:
      type: object
      required: [x, y, w, h, chain, sel, tag, text, detached]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
        detached:
          type: boolean
          description: The element is gone from the latest capture; the box is where it last was
    Comment:
      type: object
      required: [id, kind, target, theme, anchor, body, author, status, createdCommit, resolvedCommit, rev, createdAt, updatedAt, replies]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        anchor:
          $ref: "#/components/schemas/Anchor"
        body:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        status:
          type: string
          enum: [open, resolved]
        createdCommit:
          type: string
        resolvedCommit:
          type: [string, "null"]
        rev:
          type: integer
          description: Send it back with replies, resolves and reopens
        createdAt:
          type: string
        updatedAt:
          type: string
        branch:
          type: integer
          description: Made on this branch's screen (absent = on main)
        replies:
          type: array
          items:
            type: object
            required: [id, author, body, kind, createdAt]
            properties:
              id:
                type: integer
              author:
                $ref: "#/components/schemas/Person"
              body:
                type: string
              kind:
                type: string
                enum: [reply, resolve, reopen]
              createdAt:
                type: string
    AnswerInput:
      type: object
      additionalProperties: false
      required: [rev]
      properties:
        rev:
          type: integer
          description: The comment revision you saw
        body:
          type: string
          description: Required for a reply, optional note for resolve and reopen
    RenderInput:
      type: object
      additionalProperties: false
      properties:
        rev:
          type: string
          description: "`main` (default), `v<number>` or a commit id"
        targets:
          type: array
          description: Screen or story ids; empty = all
          items:
            type: string
        themes:
          type: array
          description: Default `light`
          items:
            type: string
            enum: [light, dark]
        force:
          type: boolean
          description: Capture only. Render again although already captured at this commit
        image:
          type: boolean
          description: >-
            Check only. Return each picture (`image`, JPEG base64) — how a branch is seen without
            touching the board's captures
    RenderResult:
      type: object
      required: [kind, target, theme, issues, captured]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        ready:
          type: string
          description: "`true` or `error`; absent when the page never got ready"
        issues:
          type: array
          description: Page errors, console errors, missing mocks
          items:
            type: string
        captured:
          type: boolean
          description: Capture only. False when the stored capture was already at this commit
        image:
          type: string
          description: A check with `image`. The picture, JPEG base64
    Capture:
      type: object
      required: [kind, target, theme, commit, width, height, issues, sources, capturedAt, stale]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        commit:
          type: string
        width:
          type: integer
        height:
          type: integer
        issues:
          type: array
          items:
            type: string
        sources:
          type: array
          description: Source files the rendered elements came from, relative to the app
          items:
            type: string
        capturedAt:
          type: string
        stale:
          type: boolean
    Element:
      type: object
      required: [x, y, w, h, chain, sel, tag, text]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          description: Component names, outermost first
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
          description: "`path:line:col` of the JSX that made the element"
        slot:
          type: string
          description: shadcn `data-slot`
    Preview:
      type: object
      required: [commit, state, steps, error]
      properties:
        commit:
          type: string
        state:
          type: string
          enum: [queued, running, ready, failed]
        steps:
          type: array
          items:
            type: object
            required: [name, state, durationMs, detail]
            properties:
              name:
                type: string
                description: extract, install, typecheck, lint or build
              state:
                type: string
                enum: [ok, failed, skipped]
              durationMs:
                type: integer
              detail:
                type: string
                description: Why it was skipped, or the end of its output when it failed
        error:
          type: string
          description: Empty unless the build failed
        baseUrl:
          type: string
          description: Present once ready, ends with `/`
        token:
          type: string
          description: Present once ready
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `unauthorized`, `conflict`, `not_found`
        message:
          type: string
          description: Human-readable message in English
        detail:
          description: Extra context; shape depends on `code` (a 409 carries the current state)
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: 0.0.0
        latest:
          type: [string, "null"]
          description: Latest released version; null when unknown or update checks are off
    SystemInfo:
      type: object
      required: [version, latest, toolUrl, previewUrl, localMode, services]
      properties:
        version:
          type: string
        latest:
          type: [string, "null"]
          description: Latest released version; null when unknown or update checks are off
        toolUrl:
          type: [string, "null"]
          description: Where people open the web tool
        previewUrl:
          type: [string, "null"]
        localMode:
          type: boolean
        services:
          type: object
          required: [workspace, render]
          properties:
            workspace:
              $ref: "#/components/schemas/ServiceState"
            render:
              $ref: "#/components/schemas/ServiceState"
    ServiceState:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Why it fails (admins only)
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    User:
      type: object
      required: [id, name, role, createdAt, lastUsedAt]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
          description: When the token was last used to come in (browser or CLI)
    Member:
      description: A member as admins see them, with the token to hand over
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [token, owner]
          properties:
            token:
              type: string
            owner:
              type: boolean
              description: The first admin, made at first start; cannot be removed or demoted
    Access:
      type: object
      additionalProperties: false
      required: [visitors]
      properties:
        visitors:
          $ref: "#/components/schemas/VisitorAccess"
    VisitorAccess:
      type: string
      enum: [none, view, comment]
      description: "What people without a token may do: `none` (a token is needed), `view` (screens, flows, code view, comments; no checkout), `comment` (view, and comment under their made-up name)"
    ShareMode:
      type: string
      enum: [address, tailscale, funnel, ngrok, lan]
      description: "`address`: set up by hand (reverse proxy or tunnel to the remote door); `tailscale`: people on the tailnet (Tailscale or Headscale); `funnel`: anyone, through Tailscale Funnel; `ngrok`: anyone, through ngrok run by the server; `lan`: this machine's LAN address, for trying out"
    Sharing:
      type: object
      required: [fixed, mode, url, domain, modes, warning, ngrokToken]
      properties:
        modes:
          type: array
          description: The ways this machine can share
          items:
            type: object
            required: [mode, available, detail]
            properties:
              mode:
                $ref: "#/components/schemas/ShareMode"
              available:
                type: boolean
              detail:
                type: string
                description: The address it would give, or why it cannot be used
        warning:
          type: [string, "null"]
          description: A tunnel problem (at start, or while turning sharing off)
        domain:
          type: [string, "null"]
          description: "The domain asked for (`ngrok`)"
        ngrokToken:
          type: [string, "null"]
          description: Last characters of the saved ngrok authtoken
        fixed:
          type: boolean
          description: Set by the server's environment (--public); the page only shows it
        mode:
          oneOf:
            - $ref: "#/components/schemas/ShareMode"
            - type: "null"
        url:
          type: [string, "null"]
    Notification:
      type: object
      required: [id, kind, project, actor, text, link, data, createdAt, readAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
            - comment.added
            - comment.replied
            - comment.resolved
            - comment.reopened
            - branch.review
            - branch.merged
            - branch.clash
        project:
          type: [string, "null"]
        actor:
          type: string
        text:
          type: string
          description: One line for people
        link:
          type: string
          description: Path on the tool to open
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
        readAt:
          type: [string, "null"]
    Webhook:
      type: object
      required: [id, url, events, project, secretLast4, createdBy, createdAt, lastStatus, lastError, lastDeliveryAt]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        project:
          type: [string, "null"]
        secretLast4:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
        lastStatus:
          type: [integer, "null"]
        lastError:
          type: [string, "null"]
        lastDeliveryAt:
          type: [string, "null"]
    Me:
      type: object
      required: [kind, name, role, localMode]
      properties:
        kind:
          type: string
          enum: [user, visitor, local]
          description: >-
            `user` is a member (by token or session); `visitor` has no token and does what the
            server or the project lets visitors do (look, or also comment); `local` is the built-in
            admin before the charet has an owner (not handed to callers)
        id:
          type: string
          description: "A member's id, or a visitor's (the web tool shows the visitor's made-up name from it)"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        localMode:
          type: boolean
          description: True on a local charet reached at its own address (not through sharing); grants nothing by itself
    Project:
      type: object
      required: [key, title, visibility, visitors, visitorAccess, origin, createdAt]
      properties:
        key:
          type: string
        title:
          type: string
        visibility:
          type: string
          enum: [team, private]
        visitors:
          description: "This project's own visitor setting; `null` follows the server's"
          oneOf:
            - $ref: "#/components/schemas/VisitorAccess"
            - type: "null"
        visitorAccess:
          $ref: "#/components/schemas/VisitorAccess"
        origin:
          type: string
          enum: [empty, template, import]
        createdAt:
          type: string
          format: date-time
    Version:
      type: object
      required: [number, commit, kind, actor, note, createdAt]
      properties:
        number:
          type: integer
          minimum: 1
        commit:
          type: string
        kind:
          type: string
          enum: [initial, import, push, merge, restore]
        actor:
          type: string
        note:
          type: string
        branch:
          type: integer
          description: The branch a merge version took in
        restored:
          type: integer
          description: The version a restore version undid
        sourceCommit:
          type: string
          description: For an import, the product repo commit its files came from
        sourceTree:
          type: string
          description: For an import joined with work not handed off, the commit with only the repo's files
        handoff:
          $ref: "#/components/schemas/Handoff"
        createdAt:
          type: string
          format: date-time
    Handoff:
      type: object
      description: The version (and every one before it) is in the product repo at this commit
      required: [commit, actor, at]
      properties:
        commit:
          type: string
        actor:
          type: string
        at:
          type: string
    Baseline:
      type: object
      description: The newest version that matches a product repo commit
      required: [version, commit, kind]
      properties:
        version:
          type: integer
        commit:
          type: string
          description: Its commit in the project store
        repoCommit:
          type: string
        kind:
          type: string
          enum: [import, handoff]
    HandoffStatus:
      type: object
      required: [pending, changed]
      properties:
        baseline:
          $ref: "#/components/schemas/Baseline"
        pending:
          type: array
          items:
            type: integer
          description: Versions whose changes the repo does not have yet, oldest first (imports left out)
        changed:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: Product files main changed since the baseline (what a handoff carries)
    Export:
      type: object
      required: [fromVersion, toVersion, from, to, changes, patch]
      properties:
        fromVersion:
          type: integer
        toVersion:
          type: integer
        from:
          type: string
        to:
          type: string
        repoCommit:
          type: string
          description: The product repo commit the patch applies to
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        patch:
          type: string
          description: "`git apply` input; empty when nothing changed"
    Branch:
      type: object
      required: [number, title, author, status, base, head, conflicts, createdAt, updatedAt]
      properties:
        number:
          type: integer
          minimum: 1
        title:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        status:
          type: string
          enum: [open, in_review, merged, archived]
        base:
          type: string
          description: The main commit it last started from or caught up with
        head:
          type: string
        conflicts:
          type: array
          items:
            type: string
          description: Files that clashed with main; empty when clean
        mergedVersion:
          type: integer
        approved:
          type: string
          description: The commit an admin approved its protected-file changes at
        check:
          $ref: "#/components/schemas/MergeCheck"
        createdAt:
          type: string
        updatedAt:
          type: string
    MergeCheck:
      type: object
      description: The check of the commit merging the branch would make
      required: [main, head, commit, state, issues]
      properties:
        main:
          type: string
        head:
          type: string
        commit:
          type: string
          description: The joined commit (on no line until the merge)
        state:
          type: string
          enum: [checking, passed, failed]
        issues:
          type: array
          items:
            type: string
          description: "The build error, or `<kind> <id>: <problem>` lines"
    BranchEvent:
      type: object
      required: [actor, kind, detail, at]
      properties:
        actor:
          $ref: "#/components/schemas/Person"
        kind:
          type: string
          description: created, push, review, catch_up, conflict, merge, archive, reopen, duplicate
        detail:
          type: string
        at:
          type: string
    Change:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
        kind:
          type: string
          enum: [added, modified, deleted]
    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/Branch"
        - type: object
          required: [changes, since, behind, unapproved, events]
          properties:
            changes:
              type: array
              items:
                $ref: "#/components/schemas/Change"
            since:
              type: string
              description: The commit the changes are counted from
            behind:
              type: boolean
              description: Main moved on since the branch last caught up
            unapproved:
              type: array
              items:
                type: string
              description: Protected files it changes that an admin has not approved
            affected:
              type: array
              items:
                type: string
              description: >-
                Screens and stories (`kind:id`) its changes can reach, as far as main's captures
                tell; absent when a change may reach any of them
            events:
              type: array
              items:
                $ref: "#/components/schemas/BranchEvent"
    FileInput:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Relative, `/`-separated, no `..`, not inside `.git`
        content:
          type: string
          contentEncoding: base64
          description: File bytes in base64. Absent means delete (push only).
        executable:
          type: boolean
    CreateProject:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        title:
          type: string
        import:
          $ref: "#/components/schemas/ImportInput"
    ImportInput:
      type: object
      required: [source, files]
      additionalProperties: false
      properties:
        source:
          type: string
          description: Where the files came from, shown on the version
        commit:
          type: string
          description: The product repo commit the files came from
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileInput"
    AgentKind:
      type: string
      enum: [claude, codex, script]
      description: "`script` is a scripted stand-in for tests, offered only when the server enables it"
    RunState:
      type: string
      enum: [queued, running, done, failed, canceled]
    AgentChoice:
      type: object
      required: [agent, ready, key, model]
      properties:
        agent:
          $ref: "#/components/schemas/AgentKind"
        ready:
          type: boolean
          description: A key is set (or none is needed)
        key:
          type: string
          enum: [env, settings, none]
          description: Where its API key comes from
        keyLast4:
          type: string
        model:
          type: string
          description: The model runs use unless they ask for another; empty is the agent's default
    AgentStatus:
      type: object
      required: [enabled, default, agents]
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          description: Why it is off
        default:
          oneOf:
            - $ref: "#/components/schemas/AgentKind"
            - type: "null"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentChoice"
    AgentSettingsChange:
      type: object
      additionalProperties: false
      properties:
        default:
          $ref: "#/components/schemas/AgentKind"
        models:
          type: object
          description: Model per agent; an empty string goes back to the agent's default
          additionalProperties:
            type: string
        keys:
          type: object
          description: API key per agent; an empty string removes the saved one
          additionalProperties:
            type: string
    StartAgentRun:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          maxLength: 8000
        context:
          description: What the person pointed at (screen, element, source), passed to the agent as given
        branch:
          type: integer
          minimum: 1
          description: Your draft or a branch in review to continue; absent starts a new draft
        agent:
          $ref: "#/components/schemas/AgentKind"
        model:
          type: string
        images:
          type: array
          maxItems: 4
          items:
            type: object
            required: [mediaType, data]
            additionalProperties: false
            properties:
              mediaType:
                type: string
                enum: [image/png, image/jpeg, image/gif, image/webp]
              data:
                type: string
                description: base64, up to 5 MB decoded
    AgentRun:
      type: object
      required: [id, project, branch, actor, agent, model, prompt, context, attachments, state, error, tokensIn, tokensOut, costUsd, createdAt, startedAt, endedAt]
      properties:
        id:
          type: integer
        project:
          type: string
        branch:
          type: integer
        actor:
          $ref: "#/components/schemas/Person"
        agent:
          $ref: "#/components/schemas/AgentKind"
        model:
          type: string
        prompt:
          type: string
        context: {}
        attachments:
          type: integer
          description: Images attached to the prompt
        state:
          $ref: "#/components/schemas/RunState"
        error:
          type: [string, "null"]
        tokensIn:
          type: integer
        tokensOut:
          type: integer
        costUsd:
          type: [number, "null"]
          description: "`null` when the model's price is not known"
        createdAt:
          type: string
        startedAt:
          type: [string, "null"]
        endedAt:
          type: [string, "null"]
    AgentMessage:
      type: object
      required: [run, seq, kind, text, createdAt]
      properties:
        run:
          type: integer
        seq:
          type: integer
        kind:
          type: string
          enum: [user, assistant, tool, status]
        text:
          type: string
        tool:
          type: string
          description: "For `tool`: the tool's name"
        createdAt:
          type: string
    AgentCosts:
      type: object
      required: [people, runs]
      properties:
        people:
          type: array
          items:
            type: object
            required: [id, name, runs, tokensIn, tokensOut, costUsd, unpriced]
            properties:
              id:
                type: string
              name:
                type: string
              runs:
                type: integer
              tokensIn:
                type: integer
              tokensOut:
                type: integer
              costUsd:
                type: number
              unpriced:
                type: integer
                description: Runs whose model has no known price (not in `costUsd`)
        runs:
          type: array
          description: Newest first
          items:
            $ref: "#/components/schemas/AgentRun"
