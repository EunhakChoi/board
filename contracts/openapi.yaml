openapi: 3.1.0
info:
  title: board API
  version: 0.0.0
  description: >
    HTTP contract between board-server and its clients (board-web, board-cli).
    Every route lives under /api. Errors share one shape (Error).
    Change this file first, then run `make gen-api`.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: http://127.0.0.1:5280
tags:
  - name: system
  - name: auth
  - name: projects
  - name: captures
  - name: comments
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Running version and the latest release, when update checks are on
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Versions, links and whether the internal services answer (for `board doctor`)
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who is calling. In local mode this is the built-in admin.
      responses:
        "200":
          description: The calling actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/oidc/start:
    get:
      tags: [auth]
      operationId: startSignIn
      summary: Sends the browser to the identity provider to sign in
      parameters:
        - name: setup
          in: query
          description: Token from the one-time setup link; its first user becomes the admin
          schema:
            type: string
        - name: returnTo
          in: query
          description: Path on the tool to come back to
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider
        "503":
          description: Sign-in is not configured or the provider does not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: finishSignIn
      summary: The provider sends the browser back here
      description: >-
        Sets the session cookie and redirects to `returnTo`, or redirects to
        `/signin?error=<code>` (`setup_required`, `email_unverified`, `rejected`, `removed`,
        `cancelled`, `expired`, `unavailable`, `failed`).
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the tool
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Ends the session
      responses:
        "204":
          description: Signed out
  /api/admin/allow-rules:
    get:
      tags: [access]
      operationId: listAllowRules
      summary: Domains and addresses let in on their first sign-in (admins)
      responses:
        "200":
          description: The allowlist
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/AllowRule"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: addAllowRule
      summary: Adds a domain or address to the allowlist (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum: [domain, email]
                value:
                  type: string
                  description: "`example.com` or `someone@example.com`"
      responses:
        "201":
          description: The rule (the existing one when it was there already)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowRule"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/allow-rules/{id}:
    delete:
      tags: [access]
      operationId: removeAllowRule
      summary: Removes an allowlist rule (admins); people already in stay in
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/users:
    get:
      tags: [access]
      operationId: listUsers
      summary: Every account (admins); `pending` ones are access requests
      responses:
        "200":
          description: Accounts, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/users/{id}:
    patch:
      tags: [access]
      operationId: changeUser
      summary: Changes a member's role, removes them or lets them back in (admins)
      description: Removing someone ends their sessions at once. The last admin cannot be demoted or removed.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  $ref: "#/components/schemas/Role"
                status:
                  type: string
                  enum: [active, rejected, removed]
      responses:
        "200":
          description: The account now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/users/{id}/approve:
    post:
      tags: [access]
      operationId: approveUser
      summary: Approves an access request; the person gets in at once (admins)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/users/{id}/reject:
    post:
      tags: [access]
      operationId: rejectUser
      summary: Declines an access request (admins)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/me/cli-tokens:
    get:
      tags: [tokens]
      operationId: listCliTokens
      summary: The caller's CLI tokens
      responses:
        "200":
          description: Tokens (without their secrets)
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/CliToken"
        "400":
          $ref: "#/components/responses/Invalid"
    post:
      tags: [tokens]
      operationId: createCliToken
      summary: Creates a personal CLI token; the secret is shown only now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
      responses:
        "201":
          description: The token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CliToken"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
        "400":
          $ref: "#/components/responses/Invalid"
  /api/me/cli-tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeCliToken
      summary: Revokes one of the caller's CLI tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/device:
    post:
      tags: [tokens]
      operationId: startDeviceLogin
      summary: A CLI starts a login to be approved in the browser (no sign-in needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: What the CLI calls itself (the machine), shown on the approval page
      responses:
        "200":
          description: Codes and where to approve
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verificationUrl, verificationUrlComplete, interval, expiresIn]
                properties:
                  deviceCode:
                    type: string
                  userCode:
                    type: string
                  verificationUrl:
                    type: string
                  verificationUrlComplete:
                    type: string
                  interval:
                    type: integer
                    description: Seconds between polls
                  expiresIn:
                    type: integer
  /api/auth/device/token:
    post:
      tags: [tokens]
      operationId: pollDeviceLogin
      summary: The CLI asks whether its login was approved
      description: >-
        `400` with code `authorization_pending` (ask again after `interval`), `access_denied` or
        `expired_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              additionalProperties: false
              properties:
                deviceCode:
                  type: string
      responses:
        "200":
          description: Approved; the token (handed out once)
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/Invalid"
  /api/auth/device/{code}:
    get:
      tags: [tokens]
      operationId: getDeviceLogin
      summary: A waiting CLI login, for the approval page
      parameters:
        - $ref: "#/components/parameters/UserCode"
      responses:
        "200":
          description: The login
          content:
            application/json:
              schema:
                type: object
                required: [userCode, name, status]
                properties:
                  userCode:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum: [pending, approved, denied]
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/device/{code}/approve:
    post:
      tags: [tokens]
      operationId: approveDeviceLogin
      summary: Lets the waiting CLI act as the caller
      parameters:
        - $ref: "#/components/parameters/UserCode"
      responses:
        "204":
          description: Approved
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/device/{code}/deny:
    post:
      tags: [tokens]
      operationId: denyDeviceLogin
      summary: Turns the waiting CLI login down
      parameters:
        - $ref: "#/components/parameters/UserCode"
      responses:
        "204":
          description: Denied
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/links/{token}:
    get:
      tags: [links]
      operationId: getSharedLink
      summary: What a share link opens (no sign-in needed)
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: The project and the role the link gives
          content:
            application/json:
              schema:
                type: object
                required: [project, projectTitle, role]
                properties:
                  project:
                    type: string
                  projectTitle:
                    type: string
                  role:
                    $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/links/{token}/enter:
    post:
      tags: [links]
      operationId: enterSharedLink
      summary: Comes in through a share link under a name; sets the session cookie
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: 1-40 characters, shown next to what the guest does
      responses:
        "200":
          description: In; the project to open
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    type: string
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the caller can see
      responses:
        "200":
          description: Projects, by key
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project, empty or from imported files (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: The project and its first version
          content:
            application/json:
              schema:
                type: object
                required: [project, version]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  version:
                    $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A project with that key exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete the project with its versions, captures and comments (admin; no undo)
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Renames a project or sets who can see it (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                visibility:
                  type: string
                  enum: [team, private]
                  description: "`private`: only members and admins see it"
      responses:
        "200":
          description: The project now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/members:
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: Who may see the project while it is private, besides admins (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      responses:
        "200":
          description: User ids
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/members/{user}:
    put:
      tags: [projects]
      operationId: addProjectMember
      summary: Adds a member (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Added
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      operationId: removeProjectMember
      summary: Removes a member (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/share-links:
    get:
      tags: [links]
      operationId: listShareLinks
      summary: A project's share links, revoked ones included (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      responses:
        "200":
          description: Links, newest first
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShareLink"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [links]
      operationId: createShareLink
      summary: Creates a share link (admins); its address is shown only now
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum: [editor, commenter, viewer]
                label:
                  type: string
      responses:
        "201":
          description: The link and its address
          content:
            application/json:
              schema:
                type: object
                required: [link, token, url]
                properties:
                  link:
                    $ref: "#/components/schemas/ShareLink"
                  token:
                    type: string
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/share-links/{id}/revoke:
    post:
      tags: [links]
      operationId: revokeShareLink
      summary: Revokes a share link; everyone who came in through it is out at once (admins)
      parameters:
        - $ref: "#/components/parameters/ProjectKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/checkout:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: checkoutProject
      summary: The project files at a revision, as a gzipped tar
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
      responses:
        "200":
          description: Gzipped tar of the files
          headers:
            X-Board-Commit:
              description: Commit id of the archive
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/push:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [projects]
      operationId: pushProject
      summary: Commit changed files on top of `base` and record a version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, files]
              additionalProperties: false
              properties:
                base:
                  type: string
                  description: Commit the changes were made on (from checkout)
                message:
                  type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileInput"
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`main` moved since `base`; `detail.head` is the current commit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listVersions
      responses:
        "200":
          description: Versions of main, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: diffProject
      summary: Paths changed between two revisions
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          description: Defaults to `main`
          schema:
            type: string
      responses:
        "200":
          description: Changed paths
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [path, kind]
                      properties:
                        path:
                          type: string
                        kind:
                          type: string
                          enum: [added, modified, deleted]
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: previewProject
      summary: Static build of a revision, started on first call; poll until ready or failed
      description: >
        Once ready, pages are at `baseUrl` on the preview origin, e.g.
        `{baseUrl}.board/frame.html?screen=<id>&t=<token>`. The token is short-lived and bound to
        this project and commit.
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
        - name: retry
          in: query
          description: Build again when the last build of this commit failed
          schema:
            type: boolean
      responses:
        "200":
          description: The build and, once ready, where to open it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: board-workspace is not running, or previews are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [captures]
      operationId: checkProject
      summary: Open screens and stories of a revision and report problems (nothing is stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [captures]
      operationId: listCaptures
      summary: Stored captures, each marked stale when main moved in a way that can change it
      responses:
        "200":
          description: Captures
          content:
            application/json:
              schema:
                type: object
                required: [captures]
                properties:
                  captures:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capture"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [captures]
      operationId: captureProject
      summary: Capture screens and stories of a revision; already captured at that commit = skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/image:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureImage
      summary: The capture's picture
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/sheet:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [captures]
      operationId: captureSheet
      summary: Stored captures side by side in one picture (planned steps and missing captures are grey)
      parameters:
        - name: items
          in: query
          required: true
          description: "Comma separated `screen:<id>`, `story:<id>` or `planned`, at most 24"
          schema:
            type: string
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/elements:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureElements
      summary: The capture's element map
      responses:
        "200":
          description: Elements worth pointing at, in document order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Element"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [comments]
      operationId: listComments
      summary: Comments with their threads, oldest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
        - name: kind
          in: query
          schema:
            type: string
            enum: [screen, story]
        - name: target
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [comments]
      operationId: addComment
      summary: Comment on an element of the latest capture (by point or selector)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, target, at, body]
              properties:
                kind:
                  type: string
                  enum: [screen, story]
                target:
                  type: string
                theme:
                  type: string
                  enum: [light, dark]
                at:
                  oneOf:
                    - type: object
                      required: [x, y]
                      properties:
                        x:
                          type: integer
                        y:
                          type: integer
                    - type: object
                      required: [selector]
                      properties:
                        selector:
                          type: string
                body:
                  type: string
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: getComment
      summary: One comment with its thread
      responses:
        "200":
          description: The comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: replyComment
      summary: Reply in the thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: resolveComment
      summary: Resolve, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: reopenComment
      summary: Reopen, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: commentSnapshot
      summary: The capture the comment was made on (JPEG); the anchor box marks the element
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/manifest:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getManifest
      summary: Pages, screens, connections, flows and stories of a revision (from its build)
      parameters:
        - $ref: "#/components/parameters/Rev"
      responses:
        "200":
          description: The manifest (`.board/manifest.json`, see @board/sdk `Manifest`)
          content:
            application/json:
              schema:
                type: object
                required: [commit, manifest]
                properties:
                  commit:
                    type: string
                  manifest:
                    $ref: "#/components/schemas/Manifest"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/files:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listFiles
      summary: Every file path of a revision
      parameters:
        - $ref: "#/components/parameters/Rev"
      responses:
        "200":
          description: Sorted paths
          content:
            application/json:
              schema:
                type: object
                required: [commit, paths]
                properties:
                  commit:
                    type: string
                  paths:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/file:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: readFile
      summary: One file of a revision (up to 2 MB)
      parameters:
        - $ref: "#/components/parameters/Rev"
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The bytes; `text/plain` when UTF-8. `X-Board-Commit` is the commit read.
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    MemberId:
      name: user
      in: path
      required: true
      description: A user id
      schema:
        type: string
    UserCode:
      name: code
      in: path
      required: true
      description: The code the CLI printed (`BCDF-GHJK`)
      schema:
        type: string
    LinkToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Rev:
      name: rev
      in: query
      description: "`main` (default), `v<number>` or a commit id"
      schema:
        type: string
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CaptureKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [screen, story]
    CaptureTarget:
      name: target
      in: path
      required: true
      description: Screen or story id
      schema:
        type: string
    Theme:
      name: theme
      in: path
      required: true
      schema:
        type: string
        enum: [light, dark]
    ProjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  responses:
    Changed:
      description: Someone wrote to it since you read it; `detail.rev` is its revision now
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Pending:
      description: Not possible yet (the preview is still building); try again shortly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A service board needs (board-workspace, board-render) is not running
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RenderResults:
      description: One result per target and theme, in request order
      content:
        application/json:
          schema:
            type: object
            required: [commit, results]
            properties:
              commit:
                type: string
                description: The commit rendered; pass it as `rev` to render more of the same version
              results:
                type: array
                items:
                  $ref: "#/components/schemas/RenderResult"
    Invalid:
      description: Bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (or hidden from the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Size:
      type: object
      required: [w, h]
      properties:
        w:
          type: integer
        h:
          type: integer
    Manifest:
      type: object
      required: [manifestVersion, title, pages, screens, connections, flows, stories]
      properties:
        manifestVersion:
          type: integer
          enum: [1]
        title:
          type: string
        pages:
          type: array
          items:
            type: object
            required: [id, route, title]
            properties:
              id:
                type: string
              route:
                type: string
              title:
                type: string
              note:
                type: string
                description: What the page is for (absent in older builds)
        screens:
          type: array
          items:
            type: object
            required: [id, page, title, note, route, size, hasSetup]
            properties:
              id:
                type: string
              page:
                type: string
              title:
                type: string
              note:
                type: string
              route:
                type: string
              size:
                $ref: "#/components/schemas/Size"
              hasSetup:
                type: boolean
        connections:
          type: array
          items:
            type: object
            required: [from, to, label, kind]
            properties:
              from:
                type: string
              to:
                type: string
              label:
                type: string
              kind:
                type: string
                enum: [click, auto, error]
        flows:
          type: array
          items:
            type: object
            required: [id, title, steps]
            properties:
              id:
                type: string
              title:
                type: string
              note:
                type: string
                description: What the user is trying to do (absent in older builds)
              steps:
                type: array
                items:
                  type: object
                  required: [id, title, note, planned]
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    note:
                      type: string
                    planned:
                      type: boolean
                      description: Not a screen yet
        stories:
          type: array
          items:
            type: object
            required: [id, component, title, size]
            properties:
              id:
                type: string
              component:
                type: string
              title:
                type: string
              size:
                $ref: "#/components/schemas/Size"
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Anchor:
      type: object
      required: [x, y, w, h, chain, sel, tag, text, detached]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
        detached:
          type: boolean
          description: The element is gone from the latest capture; the box is where it last was
    Comment:
      type: object
      required: [id, kind, target, theme, anchor, body, author, status, createdCommit, resolvedCommit, rev, createdAt, updatedAt, replies]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        anchor:
          $ref: "#/components/schemas/Anchor"
        body:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        status:
          type: string
          enum: [open, resolved]
        createdCommit:
          type: string
        resolvedCommit:
          type: [string, "null"]
        rev:
          type: integer
          description: Send it back with replies, resolves and reopens
        createdAt:
          type: string
        updatedAt:
          type: string
        replies:
          type: array
          items:
            type: object
            required: [id, author, body, kind, createdAt]
            properties:
              id:
                type: integer
              author:
                $ref: "#/components/schemas/Person"
              body:
                type: string
              kind:
                type: string
                enum: [reply, resolve, reopen]
              createdAt:
                type: string
    AnswerInput:
      type: object
      additionalProperties: false
      required: [rev]
      properties:
        rev:
          type: integer
          description: The comment revision you saw
        body:
          type: string
          description: Required for a reply, optional note for resolve and reopen
    RenderInput:
      type: object
      additionalProperties: false
      properties:
        rev:
          type: string
          description: "`main` (default), `v<number>` or a commit id"
        targets:
          type: array
          description: Screen or story ids; empty = all
          items:
            type: string
        themes:
          type: array
          description: Default `light`
          items:
            type: string
            enum: [light, dark]
        force:
          type: boolean
          description: Capture only. Render again although already captured at this commit
    RenderResult:
      type: object
      required: [kind, target, theme, issues, captured]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        ready:
          type: string
          description: "`true` or `error`; absent when the page never got ready"
        issues:
          type: array
          description: Page errors, console errors, missing mocks
          items:
            type: string
        captured:
          type: boolean
          description: Capture only. False when the stored capture was already at this commit
    Capture:
      type: object
      required: [kind, target, theme, commit, width, height, issues, sources, capturedAt, stale]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        commit:
          type: string
        width:
          type: integer
        height:
          type: integer
        issues:
          type: array
          items:
            type: string
        sources:
          type: array
          description: Source files the rendered elements came from, relative to the app
          items:
            type: string
        capturedAt:
          type: string
        stale:
          type: boolean
    Element:
      type: object
      required: [x, y, w, h, chain, sel, tag, text]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          description: Component names, outermost first
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
          description: "`path:line:col` of the JSX that made the element"
        slot:
          type: string
          description: shadcn `data-slot`
    Preview:
      type: object
      required: [commit, state, steps, error]
      properties:
        commit:
          type: string
        state:
          type: string
          enum: [queued, running, ready, failed]
        steps:
          type: array
          items:
            type: object
            required: [name, state, durationMs, detail]
            properties:
              name:
                type: string
                description: extract, install, typecheck, lint or build
              state:
                type: string
                enum: [ok, failed, skipped]
              durationMs:
                type: integer
              detail:
                type: string
                description: Why it was skipped, or the end of its output when it failed
        error:
          type: string
          description: Empty unless the build failed
        baseUrl:
          type: string
          description: Present once ready, ends with `/`
        token:
          type: string
          description: Present once ready
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `unauthorized`, `conflict`, `not_found`
        message:
          type: string
          description: Human-readable message in English
        detail:
          description: Extra context; shape depends on `code` (a 409 carries the current state)
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: 0.0.0
        latest:
          type: [string, "null"]
          description: Latest released version; null when unknown or update checks are off
    SystemInfo:
      type: object
      required: [version, latest, toolUrl, previewUrl, localMode, services]
      properties:
        version:
          type: string
        latest:
          type: [string, "null"]
          description: Latest released version; null when unknown or update checks are off
        toolUrl:
          type: [string, "null"]
          description: Where people open the web tool
        previewUrl:
          type: [string, "null"]
        localMode:
          type: boolean
        services:
          type: object
          required: [workspace, render]
          properties:
            workspace:
              $ref: "#/components/schemas/ServiceState"
            render:
              $ref: "#/components/schemas/ServiceState"
    ServiceState:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Why it fails (admins only)
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    User:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [pending, active, rejected, removed]
          description: "`pending` = access request waiting for an admin"
        createdAt:
          type: string
    CliToken:
      type: object
      required: [id, name, via, createdAt, lastUsedAt]
      properties:
        id:
          type: string
        name:
          type: string
        via:
          type: string
          enum: [device, manual]
        createdAt:
          type: string
        lastUsedAt:
          type: [string, "null"]
    ShareLink:
      type: object
      required: [id, project, role, label, createdBy, createdAt, revokedAt, guests]
      properties:
        id:
          type: string
        project:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        label:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
        revokedAt:
          type: [string, "null"]
        guests:
          type: integer
          description: How many people came in through it
    AllowRule:
      type: object
      required: [id, kind, value]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [domain, email]
        value:
          type: string
    Me:
      type: object
      required: [kind, name, role, localMode]
      properties:
        kind:
          type: string
          enum: [user, guest, local, pending]
          description: >-
            `local` is the built-in admin of local mode (no sign-in); `pending` signed in and
            waits for an admin to approve the access request
        id:
          type: string
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        project:
          type: string
          description: The one project a guest's share link opens
        localMode:
          type: boolean
          description: True while the server only listens on localhost and needs no sign-in
    Project:
      type: object
      required: [key, title, visibility, origin, createdAt]
      properties:
        key:
          type: string
        title:
          type: string
        visibility:
          type: string
          enum: [team, private]
        origin:
          type: string
          enum: [empty, template, import]
        createdAt:
          type: string
          format: date-time
    Version:
      type: object
      required: [number, commit, kind, actor, note, createdAt]
      properties:
        number:
          type: integer
          minimum: 1
        commit:
          type: string
        kind:
          type: string
          enum: [initial, import, push, merge, restore]
        actor:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
    FileInput:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Relative, `/`-separated, no `..`, not inside `.git`
        content:
          type: string
          contentEncoding: base64
          description: File bytes in base64. Absent means delete (push only).
        executable:
          type: boolean
    CreateProject:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        title:
          type: string
        import:
          type: object
          required: [source, files]
          additionalProperties: false
          properties:
            source:
              type: string
              description: Where the files came from, shown on version 1
            files:
              type: array
              items:
                $ref: "#/components/schemas/FileInput"
