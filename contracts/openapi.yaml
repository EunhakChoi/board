openapi: 3.1.0
info:
  title: board API
  version: 0.0.0
  description: >
    HTTP contract between board-server and its clients (board-web, board-cli).
    Every route lives under /api. Errors share one shape (Error).
    Change this file first, then run `make gen-api`.
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
servers:
  - url: http://127.0.0.1:5280
tags:
  - name: system
  - name: auth
  - name: projects
  - name: captures
  - name: comments
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Running version and the latest release, when update checks are on
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who is calling. In local mode this is the built-in admin.
      responses:
        "200":
          description: The calling actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects the caller can see
      responses:
        "200":
          description: Projects, by key
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project, empty or from imported files (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: The project and its first version
          content:
            application/json:
              schema:
                type: object
                required: [project, version]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  version:
                    $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A project with that key exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/checkout:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: checkoutProject
      summary: The project files at a revision, as a gzipped tar
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
      responses:
        "200":
          description: Gzipped tar of the files
          headers:
            X-Board-Commit:
              description: Commit id of the archive
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/push:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [projects]
      operationId: pushProject
      summary: Commit changed files on top of `base` and record a version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, files]
              additionalProperties: false
              properties:
                base:
                  type: string
                  description: Commit the changes were made on (from checkout)
                message:
                  type: string
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/FileInput"
      responses:
        "201":
          description: The new version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`main` moved since `base`; `detail.head` is the current commit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/versions:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: listVersions
      responses:
        "200":
          description: Versions of main, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/diff:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: diffProject
      summary: Paths changed between two revisions
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          description: Defaults to `main`
          schema:
            type: string
      responses:
        "200":
          description: Changed paths
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [path, kind]
                      properties:
                        path:
                          type: string
                        kind:
                          type: string
                          enum: [added, modified, deleted]
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/preview:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [projects]
      operationId: previewProject
      summary: Static build of a revision, started on first call; poll until ready or failed
      description: >
        Once ready, pages are at `baseUrl` on the preview origin, e.g.
        `{baseUrl}.board/frame.html?screen=<id>&t=<token>`. The token is short-lived and bound to
        this project and commit.
      parameters:
        - name: rev
          in: query
          description: "`main` (default), `v<number>` or a commit id"
          schema:
            type: string
        - name: retry
          in: query
          description: Build again when the last build of this commit failed
          schema:
            type: boolean
      responses:
        "200":
          description: The build and, once ready, where to open it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: board-workspace is not running, or previews are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/projects/{key}/check:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [captures]
      operationId: checkProject
      summary: Open screens and stories of a revision and report problems (nothing is stored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [captures]
      operationId: listCaptures
      summary: Stored captures, each marked stale when main moved in a way that can change it
      responses:
        "200":
          description: Captures
          content:
            application/json:
              schema:
                type: object
                required: [captures]
                properties:
                  captures:
                    type: array
                    items:
                      $ref: "#/components/schemas/Capture"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [captures]
      operationId: captureProject
      summary: Capture screens and stories of a revision; already captured at that commit = skipped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderInput"
      responses:
        "200":
          $ref: "#/components/responses/RenderResults"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Pending"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/image:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureImage
      summary: The capture's picture
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/captures/{kind}/{target}/{theme}/elements:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CaptureKind"
      - $ref: "#/components/parameters/CaptureTarget"
      - $ref: "#/components/parameters/Theme"
    get:
      tags: [captures]
      operationId: captureElements
      summary: The capture's element map
      responses:
        "200":
          description: Elements worth pointing at, in document order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Element"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [comments]
      operationId: listComments
      summary: Comments with their threads, oldest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, all]
        - name: kind
          in: query
          schema:
            type: string
            enum: [screen, story]
        - name: target
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [comments]
      operationId: addComment
      summary: Comment on an element of the latest capture (by point or selector)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, target, at, body]
              properties:
                kind:
                  type: string
                  enum: [screen, story]
                target:
                  type: string
                theme:
                  type: string
                  enum: [light, dark]
                at:
                  oneOf:
                    - type: object
                      required: [x, y]
                      properties:
                        x:
                          type: integer
                        y:
                          type: integer
                    - type: object
                      required: [selector]
                      properties:
                        selector:
                          type: string
                body:
                  type: string
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: getComment
      summary: One comment with its thread
      responses:
        "200":
          description: The comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/projects/{key}/comments/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: replyComment
      summary: Reply in the thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: resolveComment
      summary: Resolve, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [comments]
      operationId: reopenComment
      summary: Reopen, with an optional note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: The comment after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Changed"
  /api/projects/{key}/comments/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
      - $ref: "#/components/parameters/CommentId"
    get:
      tags: [comments]
      operationId: commentSnapshot
      summary: The capture the comment was made on (JPEG); the anchor box marks the element
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CaptureKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [screen, story]
    CaptureTarget:
      name: target
      in: path
      required: true
      description: Screen or story id
      schema:
        type: string
    Theme:
      name: theme
      in: path
      required: true
      schema:
        type: string
        enum: [light, dark]
    ProjectKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
  responses:
    Changed:
      description: Someone wrote to it since you read it; `detail.rev` is its revision now
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Pending:
      description: Not possible yet (the preview is still building); try again shortly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A service board needs (board-workspace, board-render) is not running
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RenderResults:
      description: One result per target and theme, in request order
      content:
        application/json:
          schema:
            type: object
            required: [results]
            properties:
              results:
                type: array
                items:
                  $ref: "#/components/schemas/RenderResult"
    Invalid:
      description: Bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found (or hidden from the caller)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Anchor:
      type: object
      required: [x, y, w, h, chain, sel, tag, text, detached]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
        detached:
          type: boolean
          description: The element is gone from the latest capture; the box is where it last was
    Comment:
      type: object
      required: [id, kind, target, theme, anchor, body, author, status, createdCommit, resolvedCommit, rev, createdAt, updatedAt, replies]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        anchor:
          $ref: "#/components/schemas/Anchor"
        body:
          type: string
        author:
          $ref: "#/components/schemas/Person"
        status:
          type: string
          enum: [open, resolved]
        createdCommit:
          type: string
        resolvedCommit:
          type: [string, "null"]
        rev:
          type: integer
          description: Send it back with replies, resolves and reopens
        createdAt:
          type: string
        updatedAt:
          type: string
        replies:
          type: array
          items:
            type: object
            required: [id, author, body, kind, createdAt]
            properties:
              id:
                type: integer
              author:
                $ref: "#/components/schemas/Person"
              body:
                type: string
              kind:
                type: string
                enum: [reply, resolve, reopen]
              createdAt:
                type: string
    AnswerInput:
      type: object
      additionalProperties: false
      required: [rev]
      properties:
        rev:
          type: integer
          description: The comment revision you saw
        body:
          type: string
          description: Required for a reply, optional note for resolve and reopen
    RenderInput:
      type: object
      additionalProperties: false
      properties:
        rev:
          type: string
          description: "`main` (default), `v<number>` or a commit id"
        targets:
          type: array
          description: Screen or story ids; empty = all
          items:
            type: string
        themes:
          type: array
          description: Default `light`
          items:
            type: string
            enum: [light, dark]
        force:
          type: boolean
          description: Capture only. Render again although already captured at this commit
    RenderResult:
      type: object
      required: [kind, target, theme, issues, captured]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        ready:
          type: string
          description: "`true` or `error`; absent when the page never got ready"
        issues:
          type: array
          description: Page errors, console errors, missing mocks
          items:
            type: string
        captured:
          type: boolean
          description: Capture only. False when the stored capture was already at this commit
    Capture:
      type: object
      required: [kind, target, theme, commit, width, height, issues, sources, capturedAt, stale]
      properties:
        kind:
          type: string
          enum: [screen, story]
        target:
          type: string
        theme:
          type: string
          enum: [light, dark]
        commit:
          type: string
        width:
          type: integer
        height:
          type: integer
        issues:
          type: array
          items:
            type: string
        sources:
          type: array
          description: Source files the rendered elements came from, relative to the app
          items:
            type: string
        capturedAt:
          type: string
        stale:
          type: boolean
    Element:
      type: object
      required: [x, y, w, h, chain, sel, tag, text]
      properties:
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        chain:
          type: array
          description: Component names, outermost first
          items:
            type: string
        sel:
          type: string
        tag:
          type: string
        text:
          type: string
        src:
          type: string
          description: "`path:line:col` of the JSX that made the element"
        slot:
          type: string
          description: shadcn `data-slot`
    Preview:
      type: object
      required: [commit, state, steps, error]
      properties:
        commit:
          type: string
        state:
          type: string
          enum: [queued, running, ready, failed]
        steps:
          type: array
          items:
            type: object
            required: [name, state, durationMs, detail]
            properties:
              name:
                type: string
                description: extract, install, typecheck, lint or build
              state:
                type: string
                enum: [ok, failed, skipped]
              durationMs:
                type: integer
              detail:
                type: string
                description: Why it was skipped, or the end of its output when it failed
        error:
          type: string
          description: Empty unless the build failed
        baseUrl:
          type: string
          description: Present once ready, ends with `/`
        token:
          type: string
          description: Present once ready
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `unauthorized`, `conflict`, `not_found`
        message:
          type: string
          description: Human-readable message in English
        detail:
          description: Extra context; shape depends on `code` (a 409 carries the current state)
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: 0.0.0
        latest:
          type: [string, "null"]
          description: Latest released version; null when unknown or update checks are off
    Role:
      type: string
      enum: [admin, editor, commenter, viewer]
    Me:
      type: object
      required: [kind, name, role, localMode]
      properties:
        kind:
          type: string
          enum: [user, guest, local]
          description: "`local` is the built-in admin of local mode (no sign-in)"
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        localMode:
          type: boolean
          description: True while the server only listens on localhost and needs no sign-in
    Project:
      type: object
      required: [key, title, visibility, origin, createdAt]
      properties:
        key:
          type: string
        title:
          type: string
        visibility:
          type: string
          enum: [team, private]
        origin:
          type: string
          enum: [empty, template, import]
        createdAt:
          type: string
          format: date-time
    Version:
      type: object
      required: [number, commit, kind, actor, note, createdAt]
      properties:
        number:
          type: integer
          minimum: 1
        commit:
          type: string
        kind:
          type: string
          enum: [initial, import, push, merge, restore]
        actor:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
    FileInput:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Relative, `/`-separated, no `..`, not inside `.git`
        content:
          type: string
          contentEncoding: base64
          description: File bytes in base64. Absent means delete (push only).
        executable:
          type: boolean
    CreateProject:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        title:
          type: string
        import:
          type: object
          required: [source, files]
          additionalProperties: false
          properties:
            source:
              type: string
              description: Where the files came from, shown on version 1
            files:
              type: array
              items:
                $ref: "#/components/schemas/FileInput"
